name: Mobile Studio source safety checks

# Source-only validation: never builds or publishes Android APKs.
# PC WSL build watcher is the normal compiler/test runner.
# GitHub-hosted validation is opt-in only when the PC is unavailable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m compileall -q tools tests/python
      - name: Run Python tests
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Check raw finger bridge invariants
        run: |
          python -c '
          from pathlib import Path
          raw = "".join(p.read_text() for p in (
              Path("tools/patches/apply_finger_raw_motion.py"),
              Path("tools/patches/fragments/finger_raw_motion/42-pressure-proxy-diagnostics-u.inc")))
          assert "dispatchTouchEvent(MotionEvent event)" in raw
          assert "getHistoricalTouchMajor" in raw
          assert "return super.dispatchTouchEvent(event)" in raw
          assert "fingerRawGestureReset" in raw
          assert "fingerRawCaptureEnabled" in raw
          assert "return super.dispatchTouchEvent(event);" in raw
          '
      - name: Run host-only layer identity regression
        run: bash tests/run_mobile_layer_identity_regression.sh
      - name: Run host-only layer reorder regression
        run: bash tests/run_mobile_layer_reorder_regression.sh

  qt-canvas-host-test:
    # This runs the real Qt-only transfer code offscreen on Linux.
    # No Krita engine, Android emulator, APK, or publishing credentials.
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets development headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qtbase5-dev pkg-config
      - name: Build Qt-only canvas transfer smoke test
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I mobile_studio/include \
            tests/cpp/qt_canvas_transfer_smoke.cpp \
            -o /tmp/krita-canvas-transfer-smoke \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Exercise native canvas handoffs offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-canvas-transfer-smoke
      - name: Compile canvas handoffs without a desktop MDI document stack
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I mobile_studio/include \
            tests/cpp/qt_widget_document_root.cpp \
            -o /tmp/krita-widget-document-root-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Verify native canvas identity with generic QWidget document root
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-widget-document-root-test
      - name: Build independent lightweight Qt painting canvas host
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I mobile_studio/include \
            tests/cpp/qt_lightweight_canvas_host.cpp \
            -o /tmp/krita-lightweight-canvas-host-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Test independent host lifecycle without desktop Krita
        env:
          QT_QPA_PLATFORM: offscreen
        run: /tmp/krita-lightweight-canvas-host-test
      - name: Compile native Krita close-time Save host Qt test
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I mobile_studio/include \
            tests/cpp/qt_native_krita_save_host.cpp \
            -o /tmp/krita-native-save-host-test \
            $(pkg-config --cflags --libs Qt5Widgets)
      - name: Test guarded close-time Save delegation
        run: /tmp/krita-native-save-host-test
      - name: Compile Android provider URI file-operation regression
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I mobile_studio/include \
            tests/cpp/qt_native_document_path_policy.cpp \
            -o /tmp/krita-native-path-policy-test \
            $(pkg-config --cflags --libs Qt5Core)
      - name: Check SAF URI open and Save As behavior
        run: /tmp/krita-native-path-policy-test
      - name: Build guarded native document rollback Qt regression
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I mobile_studio/include \
            tests/cpp/qt_native_document_rollback.cpp \
            -o /tmp/krita-native-document-rollback-test \
            $(pkg-config --cflags --libs Qt5Core)
      - name: Check destroyed and registered document rollback
        run: /tmp/krita-native-document-rollback-test
      - name: Build independent engine visible controls Qt regression
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I mobile_studio/include \
            tests/cpp/qt_native_command_layout.cpp \
            -o /tmp/krita-native-command-layout-test \
