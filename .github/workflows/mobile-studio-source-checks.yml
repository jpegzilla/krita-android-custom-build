      - name: Build embedded single-native-window host regression
        run: |
          c++ -std=c++17 -fPIC -DKRITA_MOBILE_QT_TEST -I mobile_studio/include \
            tests/cpp/qt_embedded_native_host.cpp \
            -o /tmp/krita-embedded-host-test \
